databases:
  - name: foodbot_db
    databaseName: foodbot_production
    user: foodbot
    plan: free

services:
  - type: web
    name: khana-ai
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodbot_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
    plan: free
